service: ayurmedi-backend

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${env:AWS_REGION, 'ap-south-1'}
  stage: ${env:STAGE, 'dev'}
  memorySize: 256
  timeout: 10

  httpApi:
    cors:
      allowedOrigins:
        - '*'
      allowedHeaders:
        - Content-Type
        - Authorization
        - X-Amz-Date
        - X-Api-Key
        - X-Amz-Security-Token
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      maxAge: 6000

  environment:
    STAGE: ${self:provider.stage}
    HOSPITALS_TABLE: ${self:service}-hospitals-${self:provider.stage}
    USERS_TABLE: ${self:service}-users-${self:provider.stage}
    MEDICINES_TABLE: ${self:service}-medicines-${self:provider.stage}
    DROPDOWN_CATEGORIES_TABLE: ${self:service}-dropdown-categories-${self:provider.stage}
    DROPDOWN_OPTIONS_TABLE: ${self:service}-dropdown-options-${self:provider.stage}
    DISEASES_TABLE: ${self:service}-diseases-${self:provider.stage}
    TREATMENTS_TABLE: ${self:service}-treatments-${self:provider.stage}
    PRESCRIPTION_TEMPLATES_TABLE: ${self:service}-prescription-templates-${self:provider.stage}
    PATIENTS_TABLE: ${self:service}-patients-${self:provider.stage}
    VISITS_TABLE: ${self:service}-visits-${self:provider.stage}
    PATIENT_HISTORIES_TABLE: ${self:service}-patient-histories-${self:provider.stage}
    PRESCRIPTIONS_TABLE: ${self:service}-prescriptions-${self:provider.stage}
    PRESCRIPTION_ITEMS_TABLE: ${self:service}-prescription-items-${self:provider.stage}
    FORM_FIELDS_TABLE: ${self:service}-form-fields-${self:provider.stage}
    BILLING_TABLE: ${self:service}-billing-${self:provider.stage}
    INVENTORY_TABLE: ${self:service}-inventory-${self:provider.stage}
    APPOINTMENTS_TABLE: ${self:service}-appointments-${self:provider.stage}
    IPD_ADMISSIONS_TABLE: ${self:service}-ipd-admissions-${self:provider.stage}
    PANCHAKARMA_PLANS_TABLE: ${self:service}-panchakarma-plans-${self:provider.stage}
    USER_POOL_ID: !Ref AyurmediUserPool
    USER_POOL_CLIENT_ID: !Ref AyurmediUserPoolClient

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:Query
            - dynamodb:UpdateItem
            - dynamodb:Scan
          Resource:
            - !GetAtt HospitalsTable.Arn
            - !GetAtt UsersTable.Arn
            - !GetAtt MedicinesTable.Arn
            - !GetAtt DropdownCategoriesTable.Arn
            - !GetAtt DropdownOptionsTable.Arn
            - !GetAtt DiseasesTable.Arn
            - !GetAtt TreatmentsTable.Arn
            - !GetAtt PrescriptionTemplatesTable.Arn
            - !GetAtt PatientsTable.Arn
            - !GetAtt VisitsTable.Arn
            - !GetAtt PatientHistoriesTable.Arn
            - !GetAtt PrescriptionsTable.Arn
            - !GetAtt PrescriptionItemsTable.Arn
            - !GetAtt FormFieldsTable.Arn
            - !Sub '${UsersTable.Arn}/index/*'
            - !Sub '${HospitalsTable.Arn}/index/*'
            - !Sub '${MedicinesTable.Arn}/index/*'
            - !Sub '${DropdownCategoriesTable.Arn}/index/*'
            - !Sub '${DropdownOptionsTable.Arn}/index/*'
            - !Sub '${DiseasesTable.Arn}/index/*'
            - !Sub '${TreatmentsTable.Arn}/index/*'
            - !Sub '${PrescriptionTemplatesTable.Arn}/index/*'
            - !Sub '${PatientsTable.Arn}/index/*'
            - !Sub '${VisitsTable.Arn}/index/*'
            - !Sub '${PatientHistoriesTable.Arn}/index/*'
            - !Sub '${PrescriptionsTable.Arn}/index/*'
            - !Sub '${PrescriptionItemsTable.Arn}/index/*'
            - !GetAtt BillingTable.Arn
            - !GetAtt InventoryTable.Arn
            - !Sub '${BillingTable.Arn}/index/*'
            - !Sub '${InventoryTable.Arn}/index/*'
            - !GetAtt IpdAdmissionsTable.Arn
            - !GetAtt PanchakarmaPlansTable.Arn
            - !GetAtt AppointmentsTable.Arn
            - !Sub '${IpdAdmissionsTable.Arn}/index/*'
            - !Sub '${PanchakarmaPlansTable.Arn}/index/*'
            - !Sub '${AppointmentsTable.Arn}/index/*'
            - !Sub '${FormFieldsTable.Arn}/index/*'
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminInitiateAuth
            - cognito-idp:AdminGetUser
            - cognito-idp:ForgotPassword
            - cognito-idp:ConfirmForgotPassword
          Resource: '*'

plugins:
  - serverless-plugin-split-stacks

custom:
  splitStacks:
    perFunction: false
    perType: true
    perGroupFunction: false

functions:
  authLogin:
    handler: src/handlers/auth.login
    events:
      - httpApi:
          method: POST
          path: /auth/login

  authLogout:
    handler: src/handlers/auth.logout
    events:
      - httpApi:
          method: POST
          path: /auth/logout

  authForgotPassword:
    handler: src/handlers/auth.forgotPassword
    events:
      - httpApi:
          method: POST
          path: /auth/forgot-password

  authResetPassword:
    handler: src/handlers/auth.resetPassword
    events:
      - httpApi:
          method: POST
          path: /auth/reset-password

  hospitalRegister:
    handler: src/handlers/hospital.register
    events:
      - httpApi:
          method: POST
          path: /hospital/register

  hospitalList:
    handler: src/handlers/hospital.list
    events:
      - httpApi:
          path: /hospitals/list
          method: GET

  hospitalGet:
    handler: src/handlers/hospital.getById
    events:
      - httpApi:
          path: /hospitals/{id}
          method: GET

  hospitalUpdate:
    handler: src/handlers/hospital.update
    events:
      - httpApi:
          path: /hospitals/{id}
          method: PUT

  hospitalDelete:
    handler: src/handlers/hospital.delete
    events:
      - httpApi:
          path: /hospitals/{id}
          method: DELETE

  userCreate:
    handler: src/handlers/user.create
    events:
      - httpApi:
          method: POST
          path: /user/create

  userList:
    handler: src/handlers/user.list
    events:
      - httpApi:
          method: GET
          path: /users/list

  userListByHospital:
    handler: src/handlers/user.listByHospital
    events:
      - httpApi:
          method: GET
          path: /hospitals/{hospitalId}/users

  userGet:
    handler: src/handlers/user.getById
    events:
      - httpApi:
          method: GET
          path: /users/{id}

  userUpdate:
    handler: src/handlers/user.update
    events:
      - httpApi:
          method: PUT
          path: /users/{id}

  userDelete:
    handler: src/handlers/user.delete
    events:
      - httpApi:
          method: DELETE
          path: /users/{id}

  # Medicines APIs
  medicineCreate:
    handler: src/handlers/medicine.create
    events:
      - httpApi:
          method: POST
          path: /medicines/create

  medicineList:
    handler: src/handlers/medicine.list
    events:
      - httpApi:
          method: GET
          path: /medicines/list

  medicineSearch:
    handler: src/handlers/medicine.search
    events:
      - httpApi:
          method: GET
          path: /medicines/search

  medicineUpdateStatus:
    handler: src/handlers/medicine.updateStatus
    events:
      - httpApi:
          method: PATCH
          path: /medicines/{id}/status

  # Dropdown APIs
  dropdownList:
    handler: src/handlers/dropdown.list
    events:
      - httpApi:
          method: GET
          path: /dropdowns/list

  dropdownOptions:
    handler: src/handlers/dropdown.options
    events:
      - httpApi:
          method: GET
          path: /dropdowns/{dropdown_code}/options

  dropdownGetAllWithOptions:
    handler: src/handlers/dropdown.getAllWithOptions
    events:
      - httpApi:
          method: GET
          path: /dropdowns/all-with-options

  dropdownCreateCategory:
    handler: src/handlers/dropdown.createCategory
    events:
      - httpApi:
          method: POST
          path: /dropdowns/category/create

  dropdownCreateOption:
    handler: src/handlers/dropdown.createOption
    events:
      - httpApi:
          method: POST
          path: /dropdowns/option/create

  medicineByType:
    handler: src/handlers/medicine.getByType
    events:
      - httpApi:
          method: GET
          path: /medicines/by-type

  # Diseases APIs
  diseaseCreate:
    handler: src/handlers/disease.create
    events:
      - httpApi:
          method: POST
          path: /diseases/create

  diseaseList:
    handler: src/handlers/disease.list
    events:
      - httpApi:
          method: GET
          path: /diseases/list

  # Treatments APIs
  treatmentCreate:
    handler: src/handlers/treatment.create
    events:
      - httpApi:
          method: POST
          path: /treatments/create

  treatmentListByDisease:
    handler: src/handlers/treatment.listByDisease
    events:
      - httpApi:
          method: GET
          path: /treatments/by-disease/{disease_id}

  # Prescription Template APIs
  prescriptionTemplateCreate:
    handler: src/handlers/prescription.templateCreate
    events:
      - httpApi:
          method: POST
          path: /prescriptions/template/create

  prescriptionTemplateList:
    handler: src/handlers/prescription.templateList
    events:
      - httpApi:
          method: GET
          path: /prescriptions/templates/list

  prescriptionTemplateGet:
    handler: src/handlers/prescription.templateGet
    events:
      - httpApi:
          method: GET
          path: /prescriptions/template/{id}

  # Patient APIs
  patientRegister:
    handler: src/handlers/patient.register
    events:
      - httpApi:
          method: POST
          path: /patients/register

  patientSearch:
    handler: src/handlers/patient.search
    events:
      - httpApi:
          method: GET
          path: /patients/search

  patientList:
    handler: src/handlers/patient.list
    events:
      - httpApi:
          method: GET
          path: /patients/list

  patientGetById:
    handler: src/handlers/patient.getById
    events:
      - httpApi:
          method: GET
          path: /patients/{id}

  # Visit APIs
  visitCreate:
    handler: src/handlers/visit.create
    events:
      - httpApi:
          method: POST
          path: /visits/create

  visitQueue:
    handler: src/handlers/visit.queue
    events:
      - httpApi:
          method: GET
          path: /visits/queue

  visitGetById:
    handler: src/handlers/visit.getById
    events:
      - httpApi:
          method: GET
          path: /visits/{id}

  visitByPatient:
    handler: src/handlers/visit.byPatient
    events:
      - httpApi:
          method: GET
          path: /visits/by-patient/{patient_id}

  visitComplete:
    handler: src/handlers/visit.complete
    events:
      - httpApi:
          method: PATCH
          path: /visits/{id}/complete

  # Patient History APIs
  visitSaveHistory:
    handler: src/handlers/visit.saveHistory
    events:
      - httpApi:
          method: POST
          path: /visits/{id}/history

  visitGetHistory:
    handler: src/handlers/visit.getHistory
    events:
      - httpApi:
          method: GET
          path: /visits/{id}/history

  # Prescription APIs
  prescriptionCreate:
    handler: src/handlers/visit-prescription.create
    events:
      - httpApi:
          method: POST
          path: /visits/{id}/prescription

  prescriptionGet:
    handler: src/handlers/visit-prescription.get
    events:
      - httpApi:
          method: GET
          path: /visits/{id}/prescription

  prescriptionAddItem:
    handler: src/handlers/visit-prescription.addItem
    events:
      - httpApi:
          method: POST
          path: /prescriptions/{id}/items

  prescriptionRemoveItem:
    handler: src/handlers/visit-prescription.removeItem
    events:
      - httpApi:
          method: DELETE
          path: /prescriptions/item/{item_id}

  visitSummary:
    handler: src/handlers/visit-prescription.summary
    events:
      - httpApi:
          method: GET
          path: /visits/{id}/summary

  # Billing APIs
  billingCreate:
    handler: src/handlers/billing.handler.create
    events:
      - httpApi:
          method: POST
          path: /visits/{id}/bill

  billingGetById:
    handler: src/handlers/billing.handler.getById
    events:
      - httpApi:
          method: GET
          path: /billing/{id}

  billingGetByVisit:
    handler: src/handlers/billing.handler.getByVisit
    events:
      - httpApi:
          method: GET
          path: /visits/{id}/bill

  billingPay:
    handler: src/handlers/billing.handler.pay
    events:
      - httpApi:
          method: POST
          path: /billing/{id}/pay

  billingList:
    handler: src/handlers/billing.handler.list
    events:
      - httpApi:
          method: GET
          path: /billing/list

  billingListByPatient:
    handler: src/handlers/billing.handler.listByPatient
    events:
      - httpApi:
          method: GET
          path: /billing/by-patient/{patient_id}

  # Inventory APIs
  inventoryStockIn:
    handler: src/handlers/inventory.handler.stockIn
    events:
      - httpApi:
          method: POST
          path: /inventory/stock-in

  inventoryList:
    handler: src/handlers/inventory.handler.list
    events:
      - httpApi:
          method: GET
          path: /inventory/list

  inventoryLowStock:
    handler: src/handlers/inventory.handler.lowStock
    events:
      - httpApi:
          method: GET
          path: /inventory/low-stock

  inventoryGetByMedicine:
    handler: src/handlers/inventory.handler.getByMedicine
    events:
      - httpApi:
          method: GET
          path: /inventory/medicine/{medicine_id}

  inventoryAdjust:
    handler: src/handlers/inventory.handler.adjust
    events:
      - httpApi:
          method: PATCH
          path: /inventory/{inventory_id}/adjust

  # Report APIs
  reportVisit:
    handler: src/handlers/report.handler.visitReport
    events:
      - httpApi:
          method: GET
          path: /visits/{id}/report

  reportPatientHistory:
    handler: src/handlers/report.handler.patientHistoryReport
    events:
      - httpApi:
          method: GET
          path: /patients/{id}/history-report

  # Appointment APIs
  appointmentBook:
    handler: src/handlers/appointments.handler.book
    events:
      - httpApi:
          method: POST
          path: /appointments/book

  appointmentGetById:
    handler: src/handlers/appointments.handler.getById
    events:
      - httpApi:
          method: GET
          path: /appointments/{id}

  appointmentList:
    handler: src/handlers/appointments.handler.list
    events:
      - httpApi:
          method: GET
          path: /appointments/list

  appointmentListByPatient:
    handler: src/handlers/appointments.handler.listByPatient
    events:
      - httpApi:
          method: GET
          path: /appointments/by-patient/{patient_id}

  appointmentUpdateStatus:
    handler: src/handlers/appointments.handler.updateStatus
    events:
      - httpApi:
          method: PATCH
          path: /appointments/{id}/status

  # IPD (Inpatient Department) APIs
  ipdAdmit:
    handler: src/handlers/ipd.handler.admit
    events:
      - httpApi:
          method: POST
          path: /ipd/admit

  ipdGetById:
    handler: src/handlers/ipd.handler.getById
    events:
      - httpApi:
          method: GET
          path: /ipd/{ipd_id}

  ipdList:
    handler: src/handlers/ipd.handler.list
    events:
      - httpApi:
          method: GET
          path: /ipd/list

  ipdListByPatient:
    handler: src/handlers/ipd.handler.listByPatient
    events:
      - httpApi:
          method: GET
          path: /ipd/by-patient/{patient_id}

  ipdAddNote:
    handler: src/handlers/ipd.handler.addNote
    events:
      - httpApi:
          method: POST
          path: /ipd/{ipd_id}/note

  ipdDischarge:
    handler: src/handlers/ipd.handler.discharge
    events:
      - httpApi:
          method: PATCH
          path: /ipd/{ipd_id}/discharge

  # Panchakarma Treatment APIs
  panchakarmaCreatePlan:
    handler: src/handlers/panchakarma.handler.createPlan
    events:
      - httpApi:
          method: POST
          path: /panchakarma/plan

  panchakarmaGetPlan:
    handler: src/handlers/panchakarma.handler.getPlan
    events:
      - httpApi:
          method: GET
          path: /panchakarma/{plan_id}

  panchakarmaList:
    handler: src/handlers/panchakarma.handler.list
    events:
      - httpApi:
          method: GET
          path: /panchakarma/list

  panchakarmaListByPatient:
    handler: src/handlers/panchakarma.handler.listByPatient
    events:
      - httpApi:
          method: GET
          path: /panchakarma/by-patient/{patient_id}

  panchakarmaAddSession:
    handler: src/handlers/panchakarma.handler.addSession
    events:
      - httpApi:
          method: POST
          path: /panchakarma/{plan_id}/session

  panchakarmaComplete:
    handler: src/handlers/panchakarma.handler.completePlan
    events:
      - httpApi:
          method: PATCH
          path: /panchakarma/{plan_id}/complete

  # ─── Form Fields (Dynamic Form Schema) ───────────────────────────
  formGetSchema:
    handler: src/handlers/form.getSchema
    events:
      - httpApi:
          method: GET
          path: /forms/schema

  formUpsertField:
    handler: src/handlers/form.upsertField
    events:
      - httpApi:
          method: POST
          path: /forms/fields/upsert

  formToggleField:
    handler: src/handlers/form.toggleField
    events:
      - httpApi:
          method: PATCH
          path: /forms/fields/{field_id}/toggle

  formListFields:
    handler: src/handlers/form.listFields
    events:
      - httpApi:
          method: GET
          path: /forms/fields


resources:
  Resources:
    HospitalsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.HOSPITALS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: hospital_id
            AttributeType: S
          - AttributeName: hospital_code
            AttributeType: S
        KeySchema:
          - AttributeName: hospital_id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: hospital_code-index
            KeySchema:
              - AttributeName: hospital_code
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.USERS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: user_id
            AttributeType: S
          - AttributeName: cognito_user_id
            AttributeType: S
          - AttributeName: hospital_id
            AttributeType: S
        KeySchema:
          - AttributeName: user_id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: cognito_user_id-index
            KeySchema:
              - AttributeName: cognito_user_id
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: hospital_id-index
            KeySchema:
              - AttributeName: hospital_id
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    MedicinesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.MEDICINES_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: medicine_id
            AttributeType: S
          - AttributeName: hospital_id
            AttributeType: S
          - AttributeName: medicine_type
            AttributeType: S
          - AttributeName: name_mr
            AttributeType: S
        KeySchema:
          - AttributeName: medicine_id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: hospital-type-index
            KeySchema:
              - AttributeName: hospital_id
                KeyType: HASH
              - AttributeName: medicine_type
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: hospital-name-index
            KeySchema:
              - AttributeName: hospital_id
                KeyType: HASH
              - AttributeName: name_mr
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    DropdownCategoriesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DROPDOWN_CATEGORIES_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: dropdown_id
            AttributeType: S
          - AttributeName: dropdown_code
            AttributeType: S
          - AttributeName: hospital_id
            AttributeType: S
        KeySchema:
          - AttributeName: dropdown_id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: dropdown-code-index
            KeySchema:
              - AttributeName: dropdown_code
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: hospital-dropdown-index
            KeySchema:
              - AttributeName: hospital_id
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    DropdownOptionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DROPDOWN_OPTIONS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: option_id
            AttributeType: S
          - AttributeName: dropdown_id
            AttributeType: S
          - AttributeName: hospital_id
            AttributeType: S
        KeySchema:
          - AttributeName: option_id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: dropdown-options-index
            KeySchema:
              - AttributeName: dropdown_id
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: hospital-options-index
            KeySchema:
              - AttributeName: hospital_id
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    DiseasesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DISEASES_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: disease_id
            AttributeType: S
          - AttributeName: hospital_id
            AttributeType: S
        KeySchema:
          - AttributeName: disease_id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: hospital-diseases-index
            KeySchema:
              - AttributeName: hospital_id
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    TreatmentsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TREATMENTS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: treatment_id
            AttributeType: S
          - AttributeName: disease_id
            AttributeType: S
          - AttributeName: hospital_id
            AttributeType: S
        KeySchema:
          - AttributeName: treatment_id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: disease-treatments-index
            KeySchema:
              - AttributeName: disease_id
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: hospital-treatments-index
            KeySchema:
              - AttributeName: hospital_id
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    PrescriptionTemplatesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.PRESCRIPTION_TEMPLATES_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: template_id
            AttributeType: S
          - AttributeName: hospital_id
            AttributeType: S
          - AttributeName: disease_id
            AttributeType: S
        KeySchema:
          - AttributeName: template_id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: hospital-templates-index
            KeySchema:
              - AttributeName: hospital_id
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: disease-templates-index
            KeySchema:
              - AttributeName: disease_id
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    PatientsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.PATIENTS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: patient_id
            AttributeType: S
          - AttributeName: hospital_id
            AttributeType: S
          - AttributeName: mobile
            AttributeType: S
          - AttributeName: full_name
            AttributeType: S
        KeySchema:
          - AttributeName: patient_id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: hospital-mobile-index
            KeySchema:
              - AttributeName: hospital_id
                KeyType: HASH
              - AttributeName: mobile
