layers:
  pdfkitLayer:
    path: src/layers/pdfkit
    name: ${sls:stage}-pdfkit-layer
    description: PDFKit dependencies for prescription generation
    compatibleRuntimes:
      - nodejs20.x

custom:
  prune:
    automatic: true
    number: 3
  exportOutputs:
    include:
      - CognitoUserPoolId
      - CognitoClientId
      - S3BucketName
      - ApiGatewayUrl
    output:
      file: ./.env.deployed
  dynamodb:
    start:
      port: 8000
      inMemory: true
      migrate: true
    stages:
      - dev
      - test
