    get:
      tags: [Tokens]
      summary: "Public display board queue (NO AUTH REQUIRED)"
      description: "This endpoint is unauthenticated — intended for TV/kiosk displays in waiting areas."
      security: []
      responses:
        "200":
          description: Current queue state
          content:
            application/json:
              example:
                success: true
                data:
                  currentToken: { tokenNumber: 5, patientName: "R. Kulkarni", doctorName: "Dr. Kumar" }
                  waiting: 3
                  nextTokens: []

  /hospitals/{hospitalId}/branches/{branchId}/tokens/next:
