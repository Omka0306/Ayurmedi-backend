name: Deploy Prod

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    name: Test, Deploy & Smoke E2E (prod)
    runs-on: ubuntu-latest
    environment: production  # ← requires manual approval in GitHub environment settings

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ─── Full test suite must pass before prod deploy ─────────────────────────
      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      # ─── Deploy to prod ───────────────────────────────────────────────────────
      - name: Deploy to prod stage
        id: deploy
        run: |
          npx serverless deploy --stage prod --verbose 2>&1 | tee deploy.log
          ENDPOINT=$(grep -oP 'https://[a-z0-9]+\.execute-api\.[^/]+\.amazonaws\.com/prod' deploy.log | head -1)
          echo "endpoint=${ENDPOINT}" >> "$GITHUB_OUTPUT"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-south-1

      # ─── Smoke E2E tests only (auth + hospital read — no writes to prod data) ──
      - name: Run smoke E2E tests (prod)
        run: npm run test:e2e -- --testPathPattern="phase1-auth|phase2-hospital"
        env:
          API_BASE_URL: ${{ steps.deploy.outputs.endpoint }}
          E2E_SMOKE_ONLY: 'true'

      # ─── Upload artifacts on failure ──────────────────────────────────────────
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-prod
          path: |
            test_results.log
            deploy.log
          retention-days: 30

      # ─── Notify on success ────────────────────────────────────────────────────
      - name: Prod deploy success summary
        if: success()
        run: |
          echo "✅ AyurMedi Backend deployed to PRODUCTION"
          echo "Endpoint: ${{ steps.deploy.outputs.endpoint }}"
