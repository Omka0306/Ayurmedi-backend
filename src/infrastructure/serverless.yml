service: ayurmedi-backend

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${env:AWS_REGION, 'ap-south-1'}
  stage: ${env:STAGE, 'dev'}
  memorySize: 256
  timeout: 10

  environment:
    STAGE: ${self:provider.stage}
    HOSPITALS_TABLE: ${self:service}-hospitals-${self:provider.stage}
    USERS_TABLE: ${self:service}-users-${self:provider.stage}
    USER_POOL_ID: !Ref AyurmediUserPool
    USER_POOL_CLIENT_ID: !Ref AyurmediUserPoolClient

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:Query
          Resource:
            - !GetAtt HospitalsTable.Arn
            - !GetAtt UsersTable.Arn
            - !Sub '${UsersTable.Arn}/index/*'
            - !Sub '${HospitalsTable.Arn}/index/*'
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminInitiateAuth
            - cognito-idp:ForgotPassword
            - cognito-idp:ConfirmForgotPassword
          Resource: '*'

build:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20
    platform: node
    external: []

functions:
  authLogin:
    handler: src/handlers/auth.handler.login
    events:
      - httpApi:
          method: POST
          path: /auth/login

  authLogout:
    handler: src/handlers/auth.handler.logout
    events:
      - httpApi:
          method: POST
          path: /auth/logout

  authForgotPassword:
    handler: src/handlers/auth.handler.forgotPassword
    events:
      - httpApi:
          method: POST
          path: /auth/forgot-password

  authResetPassword:
    handler: src/handlers/auth.handler.resetPassword
    events:
      - httpApi:
          method: POST
          path: /auth/reset-password

  hospitalRegister:
    handler: src/handlers/hospital.handler.register
    events:
      - httpApi:
          method: POST
          path: /hospital/register

  userCreate:
    handler: src/handlers/user.handler.create
    events:
      - httpApi:
          method: POST
          path: /user/create

resources:
  Resources:
    HospitalsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.HOSPITALS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: hospital_id
            AttributeType: S
          - AttributeName: hospital_code
            AttributeType: S
        KeySchema:
          - AttributeName: hospital_id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: hospital_code-index
            KeySchema:
              - AttributeName: hospital_code
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.USERS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: user_id
            AttributeType: S
          - AttributeName: cognito_user_id
            AttributeType: S
        KeySchema:
          - AttributeName: user_id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: cognito_user_id-index
            KeySchema:
              - AttributeName: cognito_user_id
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    AyurmediUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: ayurmedi-user-pool-${self:provider.stage}
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
        Schema:
          - Name: email
            Required: true
            Mutable: true
          - Name: hospital_id
            AttributeDataType: String
            Mutable: true
          - Name: role
            AttributeDataType: String
            Mutable: true
          - Name: branch_id
            AttributeDataType: String
            Mutable: true

    AyurmediUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        UserPoolId: !Ref AyurmediUserPool
        ClientName: ayurmedi-app-client-${self:provider.stage}
        GenerateSecret: false
        ExplicitAuthFlows:
          - ADMIN_NO_SRP_AUTH

  Outputs:
    UserPoolId:
      Value: !Ref AyurmediUserPool
    UserPoolClientId:
      Value: !Ref AyurmediUserPoolClient
    HospitalsTableName:
      Value: ${self:provider.environment.HOSPITALS_TABLE}
    UsersTableName:
      Value: ${self:provider.environment.USERS_TABLE}

